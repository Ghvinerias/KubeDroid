name: Publish Android App Bundle to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal, alpha, beta, production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status for the uploaded artifact"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - halted
          - completed

permissions:
  contents: read

jobs:
  bundle-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            b044a6fe-7a58-487c-913f-b40f014c7f53 > ANDROID_UPLOAD_KEYSTORE_BASE64
            63dc531a-4826-4979-9303-b40f014c9857      > KUBEDROID_STORE_PASSWORD
            a9ba4f2f-86ad-4b81-b311-b40f014ca585          > KUBEDROID_KEY_ALIAS
            5f23b741-253e-4a6a-9229-b40f014cb387        > KUBEDROID_KEY_PASSWORD
            b1051cb9-35e7-447c-867b-b40f014e8d4c      > PLAY_SERVICE_ACCOUNT_JSON

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        shell: bash
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Create Gradle signing properties
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          KUBEDROID_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks
          KUBEDROID_STORE_PASSWORD=$KUBEDROID_STORE_PASSWORD
          KUBEDROID_KEY_ALIAS=$KUBEDROID_KEY_ALIAS
          KUBEDROID_KEY_PASSWORD=$KUBEDROID_KEY_PASSWORD
          EOF

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kubedroid.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
            #changesNotSentForReview: true
