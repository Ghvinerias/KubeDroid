<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0D0F;
      color: #F8F8F2;
      font-family: monospace;
    }

    #terminal {
      width: 100%;
      height: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    #status {
      position: fixed;
      top: 8px;
      right: 10px;
      z-index: 5;
      color: #8B8B9A;
      font-size: 11px;
      background: rgba(13, 13, 15, 0.75);
      border-radius: 8px;
      padding: 3px 7px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="status">starting...</div>
<div id="terminal"></div>

<script src="xterm.js"></script>
<script>
  (function () {
    var terminalEl = document.getElementById('terminal');
    var statusEl = document.getElementById('status');
    var term = new Terminal({
      cursorBlink: true,
      convertEol: false,
      scrollback: 10000,
      fontSize: 14,
      theme: {
        background: '#0D0D0F',
        foreground: '#F8F8F2',
        cursor: '#8BE9FD',
        cursorAccent: '#0D0D0F',
        black: '#21222C',
        red: '#FF5555',
        green: '#50FA7B',
        yellow: '#F1FA8C',
        blue: '#BD93F9',
        magenta: '#FF79C6',
        cyan: '#8BE9FD',
        white: '#F8F8F2',
        brightBlack: '#6272A4',
        brightCyan: '#8BE9FD'
      }
    });

    function hasBridge() {
      return typeof AndroidBridge !== 'undefined' && AndroidBridge !== null;
    }

    function safeBridgeCall(fn) {
      if (!hasBridge()) return;
      try { fn(AndroidBridge); } catch (_) { }
    }

    function setStatus(text) {
      statusEl.textContent = text || '';
    }

    function writeOutput(text) {
      if (text) {
        term.write(text);
      }
    }

    function writeError(text) {
      if (text) {
        term.write('\u001b[31m' + text + '\u001b[0m');
      }
    }

    function clear() {
      term.clear();
    }

    function focus() {
      term.focus();
      safeBridgeCall(function (bridge) {
        bridge.onTerminalFocusRequested();
      });
    }

    function notifyResize() {
      var width = terminalEl.clientWidth - 16;
      var height = terminalEl.clientHeight - 16;
      var cols = Math.max(2, Math.floor(width / 9));
      var rows = Math.max(2, Math.floor(height / 18));
      term.resize(cols, rows);
      safeBridgeCall(function (bridge) {
        bridge.onTerminalResize(cols, rows);
      });
    }

    term.open(terminalEl);

    term.onData(function (data) {
      safeBridgeCall(function (bridge) {
        bridge.onTerminalInput(data);
      });
    });

    term.onKey(function () {
      focus();
    });

    terminalEl.addEventListener('touchend', focus, { passive: true });
    terminalEl.addEventListener('click', focus);

    window.addEventListener('resize', notifyResize);

    if (typeof ResizeObserver !== 'undefined') {
      var observer = new ResizeObserver(function () {
        notifyResize();
      });
      observer.observe(terminalEl);
    }

    window.KubeDroidTerminal = {
      setStatus: setStatus,
      writeOutput: writeOutput,
      writeError: writeError,
      clear: clear,
      focus: focus
    };

    notifyResize();
    focus();
    setStatus('ready');
    safeBridgeCall(function (bridge) {
      bridge.onTerminalReady();
    });
  })();
</script>
</body>
</html>
